<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mon Studio — Callback</title>
<style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#1e293b;padding:32px;border-radius:16px;max-width:640px;width:90%}h1{margin-top:0}
textarea{width:100%;height:90px;background:#0f172a;color:#22c55e;border:1px solid #334155;border-radius:8px;padding:10px;font-family:monospace;font-size:13px}
button{background:#ef4444;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:12px}.ok{color:#22c55e}</style></head>
<body><div class="card"><h1>✅ Autorisation reçue</h1>
<p>Copie le code ci-dessous et colle-le dans le chat :</p>
<textarea id="c" readonly></textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('c').value).then(()=>{document.getElementById('m').textContent='Copié ✓'})">Copier le code</button> <span id="m" class="ok"></span>
<p id="err" style="color:#f87171"></p></div>
<script>const p=new URLSearchParams(location.search);const code=p.get('code');
if(code){document.getElementById('c').value=code}else{document.getElementById('err').textContent='Aucun code dans l\'URL : '+(p.get('error_description')||p.get('error')||'')}</script></body></html>
